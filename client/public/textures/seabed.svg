<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" preserveAspectRatio="xMidYMax slice">
  <!-- Дно океану: пісок, скелі, корали та крихітне містечко зі світлом у вікнах. -->
  <defs>
    <!-- Верхній край піску напівпрозорий: інакше межа з водою читається
         різкою лінією. Так дно ніби проступає з каламуті. -->
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11344c" stop-opacity="0"/>
      <stop offset="0.16" stop-color="#11344c" stop-opacity="0.45"/>
      <stop offset="0.34" stop-color="#103045" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#071624"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102c42"/><stop offset="1" stop-color="#061523"/>
    </linearGradient>
    <radialGradient id="win" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd98a"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Далекі скелі -->
  <g fill="url(#rock)" opacity=".75">
    <path d="M0 300l120-96 96 74 74-52 110 74z"/>
    <path d="M1240 296l98-88 84 66 92-56 86 82z"/>
    <path d="M520 306l86-64 70 50 62-38 78 52z"/>
  </g>

  <!-- Корали та водорості -->
  <g stroke="#0a2233" stroke-width="7" fill="none" stroke-linecap="round" opacity=".85">
    <path d="M196 350c-8-42 6-70 30-88M196 350c10-36 2-64-14-84M232 350c2-34 16-56 38-68"/>
    <path d="M1420 350c8-44-4-74-28-92M1454 350c-2-36 10-60 32-74"/>
    <path d="M760 352c-6-30 4-52 20-66M786 352c4-28 18-46 38-54"/>
  </g>
  <g fill="#0b2740" opacity=".8">
    <circle cx="300" cy="332" r="18"/><circle cx="326" cy="342" r="12"/>
    <circle cx="1100" cy="338" r="15"/><circle cx="1122" cy="346" r="10"/>
  </g>

  <!-- Містечко на дні -->
  <g>
    <!-- Будиночок-ананас -->
    <g transform="translate(640 150)">
      <g stroke="#0d3a24" stroke-width="9" fill="none" stroke-linecap="round" opacity=".9">
        <path d="M46 26C30 4 22-8 18-24M62 22C58-4 58-20 62-36M78 26c14-22 22-34 28-48"/>
      </g>
      <path d="M62 24c40 0 66 34 66 84s-26 92-66 92-66-42-66-92 26-84 66-84z" fill="#1a4c68"/>
      <g stroke="#0a2438" stroke-width="3" opacity=".65" fill="none">
        <path d="M6 70l112 22M4 104l116 20M8 138l108 18M22 44l80 16"/>
        <path d="M30 32l16 156M62 26l0 166M94 32l-16 156"/>
      </g>
      <circle cx="42" cy="82" r="20" fill="url(#win)"/>
      <circle cx="42" cy="82" r="7" fill="#ffd98a"/>
      <circle cx="90" cy="112" r="20" fill="url(#win)"/>
      <circle cx="90" cy="112" r="7" fill="#ffd98a"/>
      <path d="M50 200v-36a12 12 0 0 1 24 0v36z" fill="#071c2c"/>
    </g>

    <!-- Купольні будиночки сусідів -->
    <g transform="translate(830 232)">
      <path d="M0 118V62a58 58 0 0 1 116 0v56z" fill="#153d58"/>
      <path d="M58 0 30 26h56z" fill="#0a2438"/>
      <circle cx="58" cy="58" r="18" fill="url(#win)"/>
      <circle cx="58" cy="58" r="6" fill="#ffd98a"/>
      <path d="M44 118V92a14 14 0 0 1 28 0v26z" fill="#071c2c"/>
    </g>

    <g transform="translate(470 258)">
      <path d="M0 92V44a48 48 0 0 1 96 0v48z" fill="#133750"/>
      <circle cx="48" cy="44" r="16" fill="url(#win)"/>
      <circle cx="48" cy="44" r="5" fill="#ffd98a"/>
      <path d="M36 92V72a12 12 0 0 1 24 0v20z" fill="#071c2c"/>
    </g>
  </g>

  <!-- Пісок -->
  <path d="M0 340c180-26 300 10 460-4s260-40 420-30 300 46 420 34 200-26 300-22v162H0z" fill="url(#sand)"/>
  <g fill="#0d2a3e" opacity=".55">
    <ellipse cx="240" cy="392" rx="70" ry="12"/>
    <ellipse cx="900" cy="404" rx="96" ry="14"/>
    <ellipse cx="1380" cy="388" rx="64" ry="11"/>
  </g>
</svg>
